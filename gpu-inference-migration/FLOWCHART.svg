<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1420" viewBox="0 0 1280 1420" role="img" aria-labelledby="title desc">
<title id="title">GPU 推理迁移｜通用逻辑优先</title>
<desc id="desc">明确源与目标；按可迁移性盘点机制；优先适配逻辑与状态；建立正确的目标执行路径；验收目标基线；交给 gpu-inference-optimization</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#527daf"/></marker></defs>
<style>text{font-family:sans-serif;fill:#193b60}.title{font-size:32px;font-weight:700}.heading{font-size:25px;font-weight:700}.body{font-size:21px}.link{font-size:20px;fill:#315fa1}</style>
<text x="60" y="65" class="title">GPU 推理迁移｜通用逻辑优先</text>
<rect x="60" y="115" width="1160" height="155" rx="14" fill="#eef4fb" stroke="#527daf"/>
<text x="90" y="155" class="heading">1. 明确源与目标</text>
<text x="90" y="198" class="body">支持同模型跨GPU、后端或负载；固定语义、质量与预算。</text>
<text x="90" y="235" class="body">保留源产物，建立独立目标记录，不擅自改变精度配方。</text>
<path d="M640,270 L640,303" stroke="#527daf" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="310" width="1160" height="155" rx="14" fill="#eef4fb" stroke="#527daf"/>
<text x="90" y="350" class="heading">2. 按可迁移性盘点机制</text>
<text x="90" y="393" class="body">区分可复用逻辑、环境参数、GPU／后端绑定实现。</text>
<text x="90" y="430" class="body">记录生效前提；通用设计不等于目标收益已经成立。</text>
<path d="M640,465 L640,498" stroke="#527daf" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="505" width="1160" height="155" rx="14" fill="#eef4fb" stroke="#527daf"/>
<text x="90" y="545" class="heading">3. 优先适配逻辑与状态</text>
<text x="90" y="588" class="body">迁移生命周期、deadline、准入、逻辑P/D、所有权与流式边界。</text>
<text x="90" y="625" class="body">按依赖完成接口适配；不照搬worker、slot、batch参数。</text>
<path d="M640,660 L640,693" stroke="#527daf" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="700" width="1160" height="155" rx="14" fill="#eef4fb" stroke="#527daf"/>
<text x="90" y="740" class="heading">4. 建立正确的目标执行路径</text>
<text x="90" y="783" class="body">兼容实现可复用；不兼容项最小适配、必要重建或授权回退。</text>
<text x="90" y="820" class="body">不强制源框架或编译引擎，不在此阶段开展穷举调优。</text>
<path d="M640,855 L640,888" stroke="#527daf" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="895" width="1160" height="155" rx="14" fill="#eef4fb" stroke="#527daf"/>
<text x="90" y="935" class="heading">5. 验收目标基线</text>
<text x="90" y="978" class="body">核对完整输出、状态交接、实际入口、资源与代表性性能。</text>
<text x="90" y="1015" class="body">错误或遗漏未解释：修复后复验，不直接进入优化。</text>
<path d="M640,1050 L640,1083" stroke="#527daf" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="1090" width="1160" height="155" rx="14" fill="#eef4fb" stroke="#527daf"/>
<text x="90" y="1130" class="heading">6. 交给 gpu-inference-optimization</text>
<text x="90" y="1173" class="body">传递SLO、负载、参考、基线、机制清单和剩余预算。</text>
<text x="90" y="1210" class="body">沿用原授权与时钟；仅迁移任务则停止，无法继续须明确说明。</text>
